{"name": "Daily report", "on": {"schedule": [{"cron": "30 19 * * *"}], "workflow_dispatch": {}}, "permissions": {"contents": "read"}, "concurrency": {"group": "dailyreport"}, "jobs": {"rep": {"runs-on": "ubuntu-latest", "steps": [{"name": "Send daily summary", "env": {"TELEGRAM_TOKEN": "${{ secrets.TELEGRAM_TOKEN }}"}, "run": "python3 - <<'PYEOF'\nimport json,os,urllib.request,urllib.parse,datetime as DT\n\nRAW='https://raw.githubusercontent.com/t13mertcan/portfolio/'\ndef get(u):\n    q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})\n    return json.load(urllib.request.urlopen(q,timeout=25))\nts=str(int(DT.datetime.now(DT.timezone.utc).timestamp()))\nP=get(RAW+'main/positions.json?t='+ts)\nH=get(RAW+'main/history.json?t='+ts)\nI=get(RAW+'data/intraday.json?t='+ts)\ntry: C=get(RAW+'main/charts.json?t='+ts)\nexcept Exception: C={'tk':{}}\nT=I.get('tk',{})\n\ndef last(k):\n    e=T.get(k)\n    if not e: return None\n    p=e.get('p') or []\n    return p[-1][1] if p else e.get('pc')\ndef prevc(k):\n    e=T.get(k)\n    if not e: return None\n    pc=e.get('pc')\n    if isinstance(pc,(int,float)) and pc>0: return pc\n    p=e.get('p') or []\n    return p[0][1] if p else None\n\nfx=last('_fx') or 0\nif not fx or fx<=0: raise SystemExit('fx yok')\n\n# --- fiyatlar ve sinif toplamlari ---\ncls_tot={'ABD':0.0,'RET':0.0,'TRD':0.0,'BIST':0.0,'Kripto':0.0}\nmovers=[]\nfor x in P['positions']:\n    tk,cl,ccy,qty=x['tk'],x['cls'],x['ccy'],x['qty']\n    pr=last(tk)\n    if not pr:\n        d=(C.get('tk') or {}).get(tk) or {}\n        for rng in ('1d','5d'):\n            if d.get(rng): pr=d[rng][-1][1]; break\n    if not pr: pr=x['avg']\n    usd=pr*qty/fx if ccy=='TRY' else pr*qty\n    if cl in cls_tot: cls_tot[cl]+=usd\n    pc=prevc(tk)\n    if pc and pc>0 and pr>0: movers.append((tk,pr/pc-1))\n\ncash=P.get('cash_usd',0)+P.get('cash_try',0)/fx\ntotal=sum(cls_tot.values())+cash\n\n# --- dunku kapanis capasi (Turkiye gunu) ---\ntoday_tr=(DT.datetime.now(DT.timezone.utc)+DT.timedelta(hours=3)).strftime('%Y-%m-%d')\nprev=None\nfor pt in H.get('points',[]):\n    if pt.get('d','')<today_tr: prev=pt\nif not prev: raise SystemExit('history capasi yok')\n\ndd=total-prev['v']; ddp=dd/prev['v'] if prev['v'] else 0\ndef pct(cur,key):\n    b=prev.get(key)\n    if not isinstance(b,(int,float)) or b<=0 or cur<=0: return None\n    return cur/b-1\nparts=[]\nfor lbl,ck,hk in [('US','ABD','us'),('RET','RET','ret'),('TRD','TRD','trd'),('BIST','BIST','bist'),('Kripto','Kripto','cr')]:\n    v=pct(cls_tot[ck],hk)\n    if v is not None: parts.append('%s %+.2f%%'%(lbl,v*100))\n\n# --- hareket edenler ---\nmovers.sort(key=lambda t:-t[1])\nbest=movers[:3]; worst=list(reversed(movers[-3:]))\nfmt_m=lambda L:' | '.join('%s %+.2f%%'%(t,v*100) for t,v in L)\n\n# --- benchmarklar ---\ndef chg(k):\n    a,b=last(k),prevc(k)\n    return (a/b-1) if (a and b and b>0) else None\nspx=chg('_spx'); gold=chg('_gold'); xu=chg('_xu'); fxc=chg('_fx')\nbl=[]\nif spx is not None: bl.append('S&P500 %+.2f%%'%(spx*100))\nif xu is not None:\n    if fxc is not None: bl.append('BIST100($) %+.2f%%'%(((1+xu)/(1+fxc)-1)*100))\n    else: bl.append('BIST100 %+.2f%%'%(xu*100))\nif gold is not None: bl.append('Alt\u0131n(ons) %+.2f%%'%(gold*100))\n\n# --- bilanco uyarisi (ABD + TRD, NY bugun/yarin) ---\nNY=DT.timezone(DT.timedelta(hours=-4))\nnyd=DT.datetime.now(NY).date()\nwarn=[]\nfor x in P['positions']:\n    if x['cls'] not in ('ABD','TRD'): continue\n    ern=((C.get('tk') or {}).get(x['tk']) or {}).get('ern')\n    if not isinstance(ern,(int,float)): continue\n    d=DT.datetime.fromtimestamp(ern,NY).date()\n    if d==nyd or d==nyd+DT.timedelta(days=1):\n        warn.append('%s%s %s'%(x['tk'],' (trade)' if x['cls']=='TRD' else '','bug\u00fcn' if d==nyd else 'yar\u0131n'))\n\nmsg='G\u00dcN SONU \u00d6ZET\u0130 - '+today_tr+'\\n'\nmsg+='Toplam: ${:,.2f}\\n'.format(total)\nmsg+='G\u00fcnl\u00fck: {}${:,.2f} ({:+.2f}%)\\n'.format('+' if dd>=0 else '-',abs(dd),ddp*100)\nif parts: msg+=' | '.join(parts)+'\\n'\nif best: msg+='En iyi: '+fmt_m(best)+'\\n'\nif worst: msg+='En k\u00f6t\u00fc: '+fmt_m(worst)+'\\n'\nif bl: msg+='Benchmark: '+' | '.join(bl)+'\\n'\nif warn: msg+='D\u0130KKAT bilan\u00e7o: '+' | '.join(warn)+'\\n'\nmsg=msg.rstrip()\n\nif os.environ.get('DRY'):\n    print(msg)\nelse:\n    TOK=os.environ.get('TELEGRAM_TOKEN','')\n    if not TOK: raise SystemExit('token yok')\n    data=urllib.parse.urlencode({'chat_id':'1146836854','text':msg}).encode()\n    r=json.load(urllib.request.urlopen('https://api.telegram.org/bot'+TOK+'/sendMessage',data=data,timeout=30))\n    print('ok' if r.get('ok') else r)\nPYEOF"}]}}}
