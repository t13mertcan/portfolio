{"name": "Earnings analysis store", "on": {"workflow_dispatch": {"inputs": {"payload": {"description": "JSON reports payload", "required": true, "type": "string"}}}}, "permissions": {"contents": "write"}, "concurrency": {"group": "earnrep"}, "jobs": {"er": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"name": "Merge", "env": {"PAYLOAD": "${{ inputs.payload }}"}, "run": "python3 - <<'PYEOF'\nimport json,os\npl=json.loads(os.environ.get('PAYLOAD','{}'))\ntry: E=json.load(open('earnings.json'))\nexcept Exception: E={'reports':[]}\nif not isinstance(E.get('reports'),list): E={'reports':[]}\nif pl.get('replace'): E['reports']=[]\nfor r in pl.get('reports',[]):\n    if not isinstance(r,dict) or not r.get('tk') or not r.get('d'): continue\n    E['reports']=[x for x in E['reports'] if not (x.get('tk')==r['tk'] and x.get('d')==r['d'])]\n    E['reports'].append(r)\nE['reports']=sorted(E['reports'],key=lambda x:x.get('d',''),reverse=True)[:20]\njson.dump(E,open('earnings.json','w'),ensure_ascii=False)\nprint('reports:',len(E['reports']))\nPYEOF"}, {"name": "Commit", "run": "git config user.name earn-bot\ngit config user.email actions@users.noreply.github.com\ngit add earnings.json\ngit diff --cached --quiet || git commit -m 'Earnings analysis'\ngit pull --rebase origin main || true\ngit push"}]}}}
