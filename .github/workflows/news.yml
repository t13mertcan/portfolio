{"name": "Update news", "on": {"schedule": [{"cron": "0 * * * *"}], "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"news": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"name": "Fetch headlines", "run": "python3 - <<'PYEOF'\nimport json,time,urllib.request,xml.etree.ElementTree as ET\nu='https://news.google.com/rss/search?q=(borsa+istanbul)+OR+bitcoin+OR+nasdaq+OR+altin+OR+(fed+faiz)+OR+dolar&hl=tr&gl=TR&ceid=TR:tr'\nq=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})\nd=urllib.request.urlopen(q,timeout=30).read()\nr=ET.fromstring(d)\no=[]\nfor i in r.iter('item'):\n    t=(i.findtext('title') or '').strip();l=(i.findtext('link') or '').strip();s=''\n    if ' - ' in t: t,s=t.rsplit(' - ',1)\n    if t and l: o.append({'t':t.strip(),'s':s.strip(),'url':l})\n    if len(o)>=14: break\njson.dump({'updated':time.strftime('%Y-%m-%d %H:%M UTC',time.gmtime()),'items':o},open('news.json','w',encoding='utf-8'),ensure_ascii=False)\nprint('items:',len(o))\nPYEOF"}, {"name": "Commit", "run": "git config user.name news-bot\ngit config user.email actions@users.noreply.github.com\ngit add news.json\ngit diff --cached --quiet || git commit -m 'Update news'\ngit push"}]}}}
