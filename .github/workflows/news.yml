{"name": "Update news", "on": {"schedule": [{"cron": "0 * * * *"}], "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"news": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"name": "Fetch headlines", "run": "python3 - <<'PYEOF'\nimport json,time,urllib.request,xml.etree.ElementTree as ET\nFEEDS=[('Bloomberg','https://feeds.bloomberg.com/markets/news.rss'),('CNBC','https://www.cnbc.com/id/20910258/device/rss/rss.html'),('WSJ','https://feeds.content.dowjones.io/public/rss/RSSMarketsMain'),('Yahoo Finance','https://finance.yahoo.com/news/rssindex'),('CoinDesk','https://www.coindesk.com/arc/outboundfeeds/rss/'),('Financial Times','https://www.ft.com/rss/home'),('Bloomberg HT','https://www.bloomberght.com/rss'),('AA Ekonomi','https://www.aa.com.tr/tr/rss/default?cat=ekonomi')]\no=[]\nfor name,u in FEEDS:\n    try:\n        q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})\n        d=urllib.request.urlopen(q,timeout=20).read()\n        r=ET.fromstring(d)\n        n=0\n        for i in r.iter('item'):\n            t=(i.findtext('title') or '').strip();l=(i.findtext('link') or '').strip()\n            if t and l:\n                o.append({'t':t,'s':name,'url':l});n+=1\n            if n>=2: break\n    except Exception:\n        pass\njson.dump({'updated':time.strftime('%Y-%m-%d %H:%M UTC',time.gmtime()),'items':o[:16]},open('news.json','w',encoding='utf-8'),ensure_ascii=False)\nprint('items:',len(o))\nPYEOF"}, {"name": "Commit", "run": "git config user.name news-bot\ngit config user.email actions@users.noreply.github.com\ngit add news.json\ngit diff --cached --quiet || git commit -m 'Update news'\ngit push"}]}}}
