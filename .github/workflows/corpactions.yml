{"name":"Corporate actions","on":{"schedule":[{"cron":"15 7 * * *"}],"workflow_dispatch":{}},"permissions":{"contents":"write"},"concurrency":{"group":"corpactions"},"jobs":{"ca":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"Detect & notify","env":{"TELEGRAM_TOKEN":"${{ secrets.TELEGRAM_TOKEN }}"},"run":"python3 - <<'PYEOF'\nimport json,os,time,urllib.request,urllib.parse,datetime as DT\n\nTOK=os.environ.get('TELEGRAM_TOKEN','')\ndef tg(method,**kw):\n    if not TOK: return None\n    data=urllib.parse.urlencode(kw).encode()\n    return json.load(urllib.request.urlopen('https://api.telegram.org/bot'+TOK+'/'+method,data=data,timeout=30))\n\nP=json.load(open('positions.json'))\ntry: SEEN=json.load(open('corp_seen.json'))\nexcept Exception: SEEN={}\ntry: PEND=json.load(open('corp_pending.json'))\nexcept Exception: PEND={'pending':[]}\n\ndef ysym(x):\n    if x['cls']=='BIST': return x['tk']+'.IS'\n    if x['cls']=='Kripto': return x['tk']+'-USD'\n    return x['tk']\n\ndef getsplits(sym):\n    q=urllib.request.Request('https://query1.finance.yahoo.com/v8/finance/chart/'+urllib.parse.quote(sym)+'?range=3mo&interval=1d&events=splits',headers={'User-Agent':'Mozilla/5.0'})\n    j=json.load(urllib.request.urlopen(q,timeout=20))\n    r=j['chart']['result'][0]\n    ev=r.get('events',{}) or {}\n    return ev.get('splits',{}) or {}\n\nnew_events=[]\nfor x in P['positions']:\n    tk=x['tk']\n    if x['cls']=='Kripto': continue\n    sym=ysym(x)\n    try:\n        splits=getsplits(sym)\n    except Exception as ex:\n        print(tk,'FAIL',repr(ex)[:80]); continue\n    prev_seen=set(SEEN.get(tk,[]))\n    is_first= tk not in SEEN\n    cur_ts=set(splits.keys())\n    if is_first:\n        SEEN[tk]=sorted(cur_ts)\n        time.sleep(0.15); continue\n    fresh=cur_ts-prev_seen\n    for ts in fresh:\n        ev=splits[ts]\n        num_,den_=ev.get('numerator'),ev.get('denominator')\n        if not num_ or not den_: continue\n        ratio=num_/den_\n        if abs(ratio-1)<1e-6: continue\n        old_qty,old_avg=x['qty'],x['avg']\n        new_qty=round(old_qty*ratio,6)\n        new_avg=round(old_avg/ratio,6)\n        d=DT.datetime.utcfromtimestamp(int(ts)).strftime('%Y-%m-%d')\n        pid=tk+'-'+d\n        if any(p['id']==pid for p in PEND['pending']): continue\n        entry={'id':pid,'tk':tk,'cls':x['cls'],'date':d,'ratio':'%g:%g'%(num_,den_),\n               'old_qty':old_qty,'old_avg':old_avg,'new_qty':new_qty,'new_avg':new_avg}\n        PEND['pending'].append(entry)\n        new_events.append(entry)\n    SEEN[tk]=sorted(cur_ts|prev_seen)\n    time.sleep(0.15)\n\nif new_events:\n    for e in new_events:\n        txt=('KURUMSAL AKSIYON TESPIT EDILDI\\n{tk} — {date} — oran {ratio}\\n'\n             'Mevcut: {oq:g} adet, ort. maliyet {oa:.4f}\\n'\n             'Onaylanirsa: {nq:g} adet, ort. maliyet {na:.4f}\\n\\n'\n             'Onaylamak icin: onayla {tk}\\n'\n             'Reddetmek icin: reddet {tk}').format(tk=e['tk'],date=e['date'],ratio=e['ratio'],\n                oq=e['old_qty'],oa=e['old_avg'],nq=e['new_qty'],na=e['new_avg'])\n        try: tg('sendMessage',chat_id='1146836854',text=txt)\n        except Exception as ex: print('tg fail',repr(ex)[:80])\n\njson.dump(SEEN,open('corp_seen.json','w'),ensure_ascii=True)\njson.dump(PEND,open('corp_pending.json','w'),ensure_ascii=True)\nprint('checked',len(P['positions']),'new_events',len(new_events))\nPYEOF"},{"name":"Commit","run":"git config user.name corp-bot\ngit config user.email actions@users.noreply.github.com\ngit add corp_seen.json corp_pending.json\ngit diff --cached --quiet || git commit -m 'Corporate action scan'\ngit pull --rebase origin main || true\ngit push"}]}}}
