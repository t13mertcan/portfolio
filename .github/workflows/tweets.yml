{"name": "Update tweets", "on": {"schedule": [{"cron": "30 * * * *"}], "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"tweets": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"name": "Fetch tweets", "run": "python3 - <<'PYEOF'\nimport json,time,re,urllib.request\nHANDLES=['enes1050392','DSAkdag']\ntry:\n    old=json.load(open('tweets.json',encoding='utf-8'))\nexcept Exception:\n    old={'accounts':{}}\nacc=old.get('accounts',{})\nfor h in HANDLES:\n    try:\n        u='https://syndication.twitter.com/srv/timeline-profile/screen-name/'+h\n        q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'})\n        d=urllib.request.urlopen(q,timeout=30).read().decode('utf-8')\n        m=re.search(r'<script id=\"__NEXT_DATA__\"[^>]*>(.*?)</script>',d,re.S)\n        j=json.loads(m.group(1))\n        entries=j['props']['pageProps']['timeline']['entries']\n        tws=[]\n        for e in entries:\n            if e.get('type')!='tweet': continue\n            t=e['content']['tweet']\n            txt=(t.get('full_text') or t.get('text') or '').strip()\n            tid=str(t.get('id_str') or '')\n            if txt and tid: tws.append({'text':txt,'date':t.get('created_at',''),'url':'https://x.com/'+h+'/status/'+tid})\n            if len(tws)>=8: break\n        if tws: acc[h]={'updated':time.strftime('%Y-%m-%d %H:%M UTC',time.gmtime()),'tweets':tws}\n        print(h,'OK',len(tws))\n    except Exception as ex:\n        print(h,'FAIL',repr(ex)[:120])\njson.dump({'accounts':acc},open('tweets.json','w',encoding='utf-8'),ensure_ascii=False)\nPYEOF"}, {"name": "Commit", "run": "git config user.name x-bot\ngit config user.email actions@users.noreply.github.com\ngit add tweets.json\ngit diff --cached --quiet || git commit -m 'Update tweets'\ngit push"}]}}}
