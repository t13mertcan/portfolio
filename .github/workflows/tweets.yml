{"name": "Update tweets", "on": {"schedule": [{"cron": "30 * * * *"}], "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"tweets": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"name": "Fetch tweets", "run": "python3 - <<'PYEOF'\nimport json,time,re,gzip,urllib.request,xml.etree.ElementTree as ET\nHANDLES=['enes1050392','DSAkdag']\ntry:\n    old=json.load(open('tweets.json',encoding='utf-8'))\nexcept Exception:\n    old={'accounts':{}}\nacc=old.get('accounts',{})\ndef get(u,ua):\n    q=urllib.request.Request(u,headers={'User-Agent':ua,'Accept-Encoding':'identity','Accept':'application/rss+xml, application/xml, text/xml, */*'})\n    raw=urllib.request.urlopen(q,timeout=30).read()\n    if raw[:2]==b'\\x1f\\x8b': raw=gzip.decompress(raw)\n    return raw\ndef via_xcancel(h):\n    raw=get('https://rss.xcancel.com/'+h+'/rss','FreshRSS/1.24.0 (Linux; https://freshrss.org)')\n    d=raw.decode('utf-8','replace')\n    i=d.find('<')\n    r=ET.fromstring(d[i:])\n    tws=[]\n    for it in r.iter('item'):\n        t=(it.findtext('title') or '').strip()\n        l=(it.findtext('link') or '').strip()\n        pd=(it.findtext('pubDate') or '').strip()\n        l=re.sub(r'https?://[^/]+/','https://x.com/',l).split('#')[0]\n        if t and l: tws.append({'text':t,'date':pd,'url':l})\n        if len(tws)>=8: break\n    return tws\ndef via_synd(h):\n    d=get('https://syndication.twitter.com/srv/timeline-profile/screen-name/'+h,'Mozilla/5.0').decode('utf-8','replace')\n    m=re.search(r'<script id=\"__NEXT_DATA__\"[^>]*>(.*?)</script>',d,re.S)\n    j=json.loads(m.group(1))\n    tws=[]\n    for e in j['props']['pageProps']['timeline']['entries']:\n        if e.get('type')!='tweet': continue\n        t=e['content']['tweet']\n        txt=(t.get('full_text') or t.get('text') or '').strip()\n        tid=str(t.get('id_str') or '')\n        if txt and tid: tws.append({'text':txt,'date':t.get('created_at',''),'url':'https://x.com/'+h+'/status/'+tid})\n        if len(tws)>=8: break\n    return tws\nfor h in HANDLES:\n    tws=[]\n    for fn in (via_xcancel,via_synd):\n        try:\n            tws=fn(h)\n            if tws: break\n        except Exception as ex:\n            print(h,fn.__name__,'FAIL',repr(ex)[:120])\n    if tws:\n        acc[h]={'updated':time.strftime('%Y-%m-%d %H:%M UTC',time.gmtime()),'tweets':tws}\n        print(h,'OK',len(tws))\n    time.sleep(3)\njson.dump({'accounts':acc},open('tweets.json','w',encoding='utf-8'),ensure_ascii=False)\nPYEOF"}, {"name": "Commit", "run": "git config user.name x-bot\ngit config user.email actions@users.noreply.github.com\ngit add tweets.json\ngit diff --cached --quiet || git commit -m 'Update tweets'\ngit push"}]}}}
