{"name": "Update tweets", "on": {"schedule": [{"cron": "30 * * * *"}], "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"tweets": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"name": "Fetch tweets", "run": "python3 - <<'PYEOF'\nimport json,time,re,gzip,urllib.request,xml.etree.ElementTree as ET\nHANDLES=['enes1050392','DSAkdag']\ntry:\n    old=json.load(open('tweets.json',encoding='utf-8'))\nexcept Exception:\n    old={'accounts':{}}\nacc=old.get('accounts',{})\ndef get(u,ua):\n    q=urllib.request.Request(u,headers={'User-Agent':ua,'Accept-Encoding':'identity','Accept':'application/rss+xml, application/xml, text/xml, */*'})\n    raw=urllib.request.urlopen(q,timeout=25).read()\n    if raw[:2]==b'\\x1f\\x8b': raw=gzip.decompress(raw)\n    return raw\nSRC=[('https://rss.xcancel.com/%s/rss','Inoreader/1.0 (+http://www.inoreader.com/feed-fetcher; 8 subscribers)'),('https://rss.xcancel.com/%s/rss','Feedbin feed-id:1234 - 8 subscribers'),('https://rss.xcancel.com/%s/rss','Miniflux/2.1.1 (+https://miniflux.app)'),('https://rss.xcancel.com/%s/rss','NewsBlur Feed Fetcher - 8 subscribers - https://newsblur.com'),('https://xcancel.com/%s/rss','Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0'),('https://nitter.net/%s/rss','Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0'),('https://nitter.space/%s/rss','Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0'),('https://lightbrd.com/%s/rss','Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0')]\ndef try_src(h,tpl,ua):\n    raw=get(tpl%h,ua)\n    d=raw.decode('utf-8','replace')\n    i=d.find('<')\n    r=ET.fromstring(d[i:])\n    tws=[]\n    for it in r.iter('item'):\n        t=(it.findtext('title') or '').strip()\n        l=(it.findtext('link') or '').strip()\n        pd=(it.findtext('pubDate') or '').strip()\n        if '/status/' not in l: continue\n        l=re.sub(r'https?://[^/]+/','https://x.com/',l).split('#')[0]\n        if t: tws.append({'text':t,'date':pd,'url':l})\n        if len(tws)>=8: break\n    return tws\ndef via_synd(h):\n    d=get('https://syndication.twitter.com/srv/timeline-profile/screen-name/'+h,'Mozilla/5.0').decode('utf-8','replace')\n    m=re.search(r'<script id=\"__NEXT_DATA__\"[^>]*>(.*?)</script>',d,re.S)\n    j=json.loads(m.group(1))\n    tws=[]\n    for e in j['props']['pageProps']['timeline']['entries']:\n        if e.get('type')!='tweet': continue\n        t=e['content']['tweet']\n        txt=(t.get('full_text') or t.get('text') or '').strip()\n        tid=str(t.get('id_str') or '')\n        if txt and tid: tws.append({'text':txt,'date':t.get('created_at',''),'url':'https://x.com/'+h+'/status/'+tid})\n        if len(tws)>=8: break\n    return tws\nfor h in HANDLES:\n    tws=[]\n    for tpl,ua in SRC:\n        host=tpl.split('/')[2]\n        try:\n            tws=try_src(h,tpl,ua)\n            if tws:\n                print(h,'OK via',host,'UA:',ua[:20],'n=',len(tws))\n                break\n            print(h,host,'empty/filtered')\n        except Exception as ex:\n            print(h,host,'FAIL',repr(ex)[:100])\n        time.sleep(2)\n    if not tws:\n        try:\n            tws=via_synd(h)\n            print(h,'OK via synd n=',len(tws))\n        except Exception as ex:\n            print(h,'synd FAIL',repr(ex)[:100])\n    if tws:\n        acc[h]={'updated':time.strftime('%Y-%m-%d %H:%M UTC',time.gmtime()),'tweets':tws}\n    time.sleep(2)\njson.dump({'accounts':acc},open('tweets.json','w',encoding='utf-8'),ensure_ascii=False)\nPYEOF"}, {"name": "Commit", "run": "git config user.name x-bot\ngit config user.email actions@users.noreply.github.com\ngit add tweets.json\ngit diff --cached --quiet || git commit -m 'Update tweets'\ngit push"}]}}}
