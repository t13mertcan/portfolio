{"name": "Telegram trade bot", "on": {"schedule": [{"cron": "*/5 * * * *"}], "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "concurrency": {"group": "tgbot"}, "jobs": {"tg": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"name": "Process messages", "env": {"TELEGRAM_TOKEN": "${{ secrets.TELEGRAM_TOKEN }}"}, "run": "python3 - <<'PYEOF'\nimport json,os,re,urllib.request,urllib.parse\nTOK=os.environ.get('TELEGRAM_TOKEN','')\nif not TOK:\n    print('no token set'); raise SystemExit(0)\nAPI='https://api.telegram.org/bot'+TOK+'/'\ndef tg(method,**kw):\n    data=urllib.parse.urlencode(kw).encode()\n    return json.load(urllib.request.urlopen(API+method,data=data,timeout=30))\ntry: ST=json.load(open('tg_state.json'))\nexcept Exception: ST={'offset':0,'owner':None}\nP=json.load(open('positions.json'))\nHELP='Format: TICKER bought/sold ADET @ FIYAT\\nOrnekler:\\nNVDA bought 10 @ 240\\nTHYAO bought 200 @ 315.50 tl\\nBTC bought 0.05 @ 64000\\nNVDA sold all @ 250\\nTrade (ABD): trade NVDA bought 5 @ 240\\nNakit: nakit cikis 5000 | nakit giris 2500 tl | cash out 300'\ndef num(s):\n    s=s.strip()\n    if ',' in s and '.' in s: s=s.replace(',','')\n    elif ',' in s: s=s.replace(',','.')\n    return float(s)\ndef parse(t):\n    t=t.replace('\u0131','i').replace('\u0130','I')\n    m=re.match(r\"(?i)^\\s*([A-Za-z0-9.\\-]{1,12})\\s+(bought|buy|aldim|sold|sell|sattim)\\s+([\\d.,]+|all|hepsi)\\s*@\\s*[\\$\u20ba]?\\s*([\\d.,]+)\\s*(tl|try|\u20ba|usd|\\$)?\\s*\\.?\\s*$\",t)\n    if not m: return None\n    return {'tk':m.group(1).upper(),'buy':m.group(2).lower() in ('bought','buy','aldim'),'q':m.group(3).lower(),'p':num(m.group(4)),'cur':(m.group(5) or '').lower()}\ndef apply(tr):\n    trd=bool(tr.get('trd'))\n    pos=[x for x in P['positions'] if x['tk']==tr['tk'] and (x['cls']=='TRD')==trd]\n    pos=pos[0] if pos else None\n    if pos: cls,ccy=pos['cls'],pos['ccy']\n    elif trd: cls,ccy='TRD','USD'\n    elif tr['tk'] in ('BTC','ETH'): cls,ccy='Kripto','USD'\n    elif tr['cur'] in ('tl','try','\u20ba'): cls,ccy='BIST','TRY'\n    else: cls,ccy='ABD','USD'\n    cash='cash_try' if ccy=='TRY' else 'cash_usd'\n    cs='\u20ba' if ccy=='TRY' else '$'\n    if tr['buy']:\n        if tr['q'] in ('all','hepsi'): return 'HATA: alimda adet gerekli.\\n'+HELP\n        q=num(tr['q']); cost=q*tr['p']\n        if pos:\n            pos['avg']=round((pos['qty']*pos['avg']+cost)/(pos['qty']+q),4); pos['qty']=round(pos['qty']+q,9)\n        else:\n            pos={'tk':tr['tk'],'cls':cls,'ccy':ccy,'qty':q,'avg':tr['p']}; P['positions'].append(pos)\n        P[cash]=round(P[cash]-cost,2)\n        r='OK ALIM islendi: {} {:g} adet @ {}{:,.2f}\\nYeni pozisyon: {:g} adet, ort. maliyet {}{:,.4f}\\nKalan nakit ({}): {}{:,.2f}'.format(tr['tk'],q,cs,tr['p'],pos['qty'],cs,pos['avg'],ccy,cs,P[cash])\n        if P[cash]<0: r+='\\nUYARI: nakit eksiye dustu!'\n        return r\n    else:\n        if not pos: return 'HATA: {} portfoyde yok.'.format(tr['tk'])\n        q=pos['qty'] if tr['q'] in ('all','hepsi') else num(tr['q'])\n        if q>pos['qty']+1e-9: return 'HATA: elinde {:g} adet {} var, {:g} satilamaz.'.format(pos['qty'],tr['tk'],q)\n        pos['qty']=round(pos['qty']-q,9); P[cash]=round(P[cash]+q*tr['p'],2)\n        left='kalan {:g} adet'.format(pos['qty'])\n        if pos['qty']<=1e-9: P['positions'].remove(pos); left='pozisyon tamamen kapandi'\n        return 'OK SATIS islendi: {} {:g} adet @ {}{:,.2f} ({})\\nYeni nakit ({}): {}{:,.2f}'.format(tr['tk'],q,cs,tr['p'],left,ccy,cs,P[cash])\nu=tg('getUpdates',offset=ST['offset']+1,timeout=0)\nn=0\nfor up in u.get('result',[]):\n    ST['offset']=up['update_id']\n    msg=up.get('message') or up.get('edited_message')\n    if not msg: continue\n    chat=msg['chat']['id']; txt=(msg.get('text') or '').strip()\n    if not txt: continue\n    if ST['owner'] is None: ST['owner']=chat\n    if chat!=ST['owner']: continue\n    n+=1\n    try: tg('setMessageReaction',chat_id=chat,message_id=msg['message_id'],reaction=json.dumps([{'type':'emoji','emoji':chr(128077)}]))\n    except Exception as ex: print('reaction fail',repr(ex)[:80])\n    if txt.lower() in ('/start','/help','help','yardim'):\n        tg('sendMessage',chat_id=chat,text='Merhaba! Islem bildirmek icin:\\n'+HELP); continue\n    mc=re.match(r\"(?i)^\\s*(nakit|cash)\\s+(cikis|out|giris|in)\\s+([\\d.,]+)\\s*(tl|try|\\u20ba|usd|\\$)?\\s*\\.?\\s*$\",txt.replace('\\u0131','i').replace('\\u0130','I'))\n    if mc:\n        amt=num(mc.group(3))\n        ccy='TRY' if (mc.group(4) or '').lower() in ('tl','try','\\u20ba') else 'USD'\n        cash='cash_try' if ccy=='TRY' else 'cash_usd'\n        cs='\\u20ba' if ccy=='TRY' else '$'\n        outp=mc.group(2).lower() in ('cikis','out')\n        P[cash]=round(P[cash]+(-amt if outp else amt),2)\n        import datetime as DT\n        fd=(DT.datetime.now(DT.timezone.utc)-DT.timedelta(hours=6)).strftime('%Y-%m-%d')\n        fl=P.get('flows')\n        if not isinstance(fl,dict) or fl.get('d')!=fd: fl={'d':fd,'usd':0,'try':0}\n        k2='usd' if ccy=='USD' else 'try'\n        fl[k2]=round(fl.get(k2,0)+(-amt if outp else amt),2)\n        P['flows']=fl\n        ft=P.get('flows_total')\n        if not isinstance(ft,dict): ft={'usd':0,'try':0}\n        ft[k2]=round(ft.get(k2,0)+(-amt if outp else amt),2)\n        P['flows_total']=ft\n        r='OK NAKIT %s islendi: %s%s%s\\nYeni nakit (%s): %s%s'%('CIKIS' if outp else 'GIRIS','-' if outp else '+',cs,'{:,.2f}'.format(amt),ccy,cs,'{:,.2f}'.format(P[cash]))\n        if P[cash]<0: r+='\\nUYARI: nakit eksiye dustu!'\n        tg('sendMessage',chat_id=chat,text=r+'\\n\\nDashboard birkac dakika icinde guncellenir.'); continue\n    trdflag=False\n    m3=re.match(r'(?i)^\\s*trade\\s+(.*)$',txt)\n    if m3: trdflag=True; txt=m3.group(1)\n    tr=parse(txt)\n    if tr: tr['trd']=trdflag\n    if not tr:\n        tg('sendMessage',chat_id=chat,text='Anlayamadim: \"'+txt[:60]+'\"\\n'+HELP); continue\n    rep=apply(tr)\n    if tr.get('trd') and rep.startswith('OK'): rep=rep.replace('OK ','OK TRADE ',1)\n    extra='\\n\\nDashboard birkac dakika icinde guncellenir.' if rep.startswith('OK') else ''\n    tg('sendMessage',chat_id=chat,text=rep+extra)\njson.dump(P,open('positions.json','w'))\njson.dump(ST,open('tg_state.json','w'))\nprint('messages',n,'offset',ST['offset'])\nPYEOF"}, {"name": "Commit", "run": "git config user.name tg-bot\ngit config user.email actions@users.noreply.github.com\ngit add positions.json tg_state.json\ngit diff --cached --quiet || git commit -m 'Telegram trade update'\ngit pull --rebase origin main || true\ngit push"}, {"name": "Intraday fetch", "run": "python3 - <<'PYEOF'\nimport json,time,urllib.request,urllib.parse\nP=json.load(open('positions.json'))\ndef ysym(x):\n    if x['cls']=='BIST': return x['tk']+'.IS'\n    if x['cls']=='Kripto': return x['tk']+'-USD'\n    return x['tk']\nsyms=[(x['tk'],ysym(x),'2d' if x['cls']=='Kripto' else '1d') for x in P['positions']]\nsyms+=[('_spx','^GSPC','1d'),('_xu','XU100.IS','1d'),('_gold','GC=F','2d'),('_fx','TRY=X','2d')]\nout={}\nok=0\nfor tk,sym,rng in syms:\n    if tk in out: continue\n    try:\n        q=urllib.request.Request('https://query1.finance.yahoo.com/v8/finance/chart/'+urllib.parse.quote(sym)+'?range='+rng+'&interval=5m',headers={'User-Agent':'Mozilla/5.0'})\n        j=json.load(urllib.request.urlopen(q,timeout=15))\n        r=j['chart']['result'][0]\n        ts=r.get('timestamp') or []\n        cl=r['indicators']['quote'][0]['close']\n        pts=[[t,round(c,4)] for t,c in zip(ts,cl) if c is not None]\n        d={'p':pts}\n        pc=r.get('meta',{}).get('chartPreviousClose')\n        if isinstance(pc,(int,float)): d['pc']=round(pc,4)\n        out[tk]=d\n        ok+=1\n    except Exception as ex:\n        print(tk,'FAIL',repr(ex)[:70])\n    time.sleep(0.12)\njson.dump({'u':time.strftime('%Y-%m-%d %H:%M UTC',time.gmtime()),'tk':out},open('/tmp/intraday.json','w'))\nprint('ok',ok,'/',len(syms))\nPYEOF"}, {"name": "Intraday push", "env": {"GITHUB_TOKEN": "${{ github.token }}"}, "run": "set -e\nif [ ! -s /tmp/intraday.json ]; then echo 'no intraday file'; exit 0; fi\nD=$(mktemp -d)\ncp /tmp/intraday.json \"$D\"/\ncd \"$D\"\ngit init -q -b data\ngit config user.name intra-bot\ngit config user.email actions@users.noreply.github.com\ngit add intraday.json\ngit commit -q -m 'Intraday data'\ngit push -q --force \"https://x-access-token:${GITHUB_TOKEN}@github.com/t13mertcan/portfolio.git\" data || echo 'intraday push failed (non-fatal)'"}]}}}
