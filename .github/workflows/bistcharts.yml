{"name": "BIST charts data", "on": {"schedule": [{"cron": "20 * * * *"}], "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"bc": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"name": "Fetch BIST history + news", "run": "python3 - <<'PYEOF'\nimport json,time,urllib.request,xml.etree.ElementTree as ET\nP=json.load(open('positions.json'))\ntks=[x['tk'] for x in P['positions'] if x['cls']=='BIST']\nRANGES=[('1d','5m'),('5d','15m'),('1mo','1d'),('3mo','1d'),('ytd','1d')]\ndef yget(u):\n    q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})\n    return urllib.request.urlopen(q,timeout=20)\nout={}\nokc=0\nfor tk in tks:\n    d={}\n    for rng,iv in RANGES:\n        try:\n            j=json.load(yget('https://query1.finance.yahoo.com/v8/finance/chart/'+tk+'.IS?range='+rng+'&interval='+iv))\n            r=j['chart']['result'][0]\n            ts=r['timestamp']; cl=r['indicators']['quote'][0]['close']\n            pts=[[t,round(c,4)] for t,c in zip(ts,cl) if c is not None]\n            if pts: d[rng]=pts\n        except Exception as ex:\n            print(tk,rng,'FAIL',repr(ex)[:80])\n        time.sleep(0.25)\n    try:\n        raw=yget('https://news.google.com/rss/search?q='+tk+'+hisse&hl=tr&gl=TR&ceid=TR:tr').read()\n        root=ET.fromstring(raw)\n        ns=[]\n        for it in root.iter('item'):\n            t2=(it.findtext('title') or '').strip()\n            l2=(it.findtext('link') or '').strip()\n            pd=(it.findtext('pubDate') or '').strip()\n            if t2 and l2: ns.append({'t':t2,'u':l2,'d':pd})\n            if len(ns)>=6: break\n        d['news']=ns\n    except Exception as ex:\n        print(tk,'news FAIL',repr(ex)[:80])\n    if d:\n        out[tk]=d\n        okc+=1\n    time.sleep(0.2)\njson.dump({'updated':time.strftime('%Y-%m-%d %H:%M UTC',time.gmtime()),'tk':out},open('bist_charts.json','w'),ensure_ascii=False)\nprint('tickers OK:',okc,'/',len(tks))\nassert okc>=len(tks)//2, 'cok fazla ticker basarisiz'\nPYEOF"}, {"name": "Commit", "run": "git config user.name bist-bot\ngit config user.email actions@users.noreply.github.com\ngit add bist_charts.json\ngit diff --cached --quiet || git commit -m 'BIST charts data'\ngit push"}]}}}
