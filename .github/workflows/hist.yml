{"name": "Daily portfolio snapshot", "on": {"schedule": [{"cron": "15 20 * * 1-5"}], "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"snap": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"name": "Snapshot + summary", "env": {"TELEGRAM_TOKEN": "${{ secrets.TELEGRAM_TOKEN }}"}, "run": "python3 - <<'PYEOF'\nimport json,os,re,urllib.request,urllib.parse,datetime\nP=json.load(open('positions.json'))\nbist=[(x['tk'],x['qty']) for x in P['positions'] if x['cls']=='BIST']\nus=[(x['tk'],x['qty']) for x in P['positions'] if x['cls']=='ABD']\nret=[(x['tk'],x['qty']) for x in P['positions'] if x['cls']=='RET']\ncr=[('BINANCE:'+x['tk']+'USDT',x['qty']) for x in P['positions'] if x['cls']=='Kripto']\ndef scan(market,tickers):\n    if not tickers: return {}\n    body=json.dumps({'symbols':{'tickers':tickers,'query':{'types':[]}},'columns':['close','change']}).encode()\n    q=urllib.request.Request('https://scanner.tradingview.com/'+market+'/scan',data=body,headers={'User-Agent':'Mozilla/5.0','Content-Type':'application/json'})\n    j=json.load(urllib.request.urlopen(q,timeout=30))\n    return {r['s']:(r['d'][0],r['d'][1]) for r in j.get('data',[])}\ntr=scan('turkey',['BIST:'+t for t,_ in bist]+['BIST:XU100'])\nus_c=[p+t for t,_ in us+ret for p in ('NASDAQ:','NYSE:','AMEX:')]\ngl=scan('global',us_c+[s for s,_ in cr]+['FX_IDC:USDTRY','TVC:GOLD','SP:SPX','TVC:SPX','FOREXCOM:SPXUSD'])\nfx,fxc=gl['FX_IDC:USDTRY']\nmiss=[]\nmovers=[]\ndef us_price(t):\n    for pre in ('NASDAQ:','NYSE:','AMEX:'):\n        p=gl.get(pre+t)\n        if p is not None: return p\n    return None\nbist_v=0.0\nfor t,q in bist:\n    p=tr.get('BIST:'+t)\n    if p is None: miss.append(t)\n    else:\n        bist_v+=p[0]*q/fx\n        movers.append((t,p[1]))\nus_v=0.0\nfor t,q in us:\n    p=us_price(t)\n    if p is None: miss.append(t)\n    else:\n        us_v+=p[0]*q\n        movers.append((t,p[1]))\nret_v=0.0\nfor t,q in ret:\n    p=us_price(t)\n    if p is None: miss.append(t)\n    else:\n        ret_v+=p[0]*q\n        movers.append((t,p[1]))\ncr_v=0.0\nfor s,q in cr:\n    p=gl.get(s)\n    if p is None: miss.append(s)\n    else:\n        cr_v+=p[0]*q\n        movers.append((s.replace('BINANCE:','').replace('USDT',''),p[1]))\nassert not miss, miss\ntot=P['cash_usd']+P['cash_try']/fx+bist_v+us_v+ret_v+cr_v\nspx=None\nfor c in ('SP:SPX','TVC:SPX','FOREXCOM:SPXUSD'):\n    if c in gl: spx=gl[c]; break\nxu=tr.get('BIST:XU100')\ngold=gl.get('TVC:GOLD')\nd=(datetime.datetime.now(datetime.timezone.utc)-datetime.timedelta(hours=6)).strftime('%Y-%m-%d')\ntry: H=json.load(open('history.json'))\nexcept Exception: H={'points':[]}\nprev=None\nfor x in H.get('points',[]):\n    if x['d']<d and (prev is None or x['d']>prev['d']): prev=x\npts=[x for x in H.get('points',[]) if x['d']!=d]\nnp={'d':d,'v':round(tot,2),'us':round(us_v,2),'ret':round(ret_v,2),'bist':round(bist_v,2),'cr':round(cr_v,2)}\nif spx: np['spx']=round(spx[0],2)\nif xu: np['xu']=round(xu[0]/fx,4)\nif gold: np['gold']=round(gold[0],2)\npts.append(np)\npts.sort(key=lambda x:x['d'])\njson.dump({'points':pts},open('history.json','w'))\nprint(d,round(tot,2),'us',round(us_v),'ret',round(ret_v),'bist',round(bist_v),'cr',round(cr_v))\nTOK=os.environ.get('TELEGRAM_TOKEN','')\ntry: owner=json.load(open('tg_state.json')).get('owner')\nexcept Exception: owner=None\nif TOK and owner:\n    def pc(a,b):\n        if not b: return None\n        return (a/b-1)*100\n    def fp(x):\n        if x is None: return 'n/a'\n        return ('+' if x>=0 else '')+'%.2f%%'%x\n    L=['GUN SONU OZETI - '+d]\n    L.append('Toplam: $'+'{:,.2f}'.format(tot))\n    fl=P.get('flows')\n    fadj=0.0\n    if prev and isinstance(fl,dict) and fl.get('d','')>prev['d']:\n        fadj=(fl.get('usd',0) or 0)+(fl.get('try',0) or 0)/fx\n    if prev:\n        base=prev['v']+fadj\n        dd=tot-base\n        L.append('Gunluk: %s$%s (%s)'%('+' if dd>=0 else '-','{:,.2f}'.format(abs(dd)),fp(pc(tot,base))))\n        if abs(fadj)>0.005: L.append('Nakit akisi bugun: %s$%s (P&L disinda)'%('+' if fadj>=0 else '-','{:,.2f}'.format(abs(fadj))))\n        L.append('US %s | RET %s | BIST %s | Kripto %s'%(fp(pc(us_v,prev.get('us'))),fp(pc(ret_v,prev.get('ret'))),fp(pc(bist_v,prev.get('bist'))),fp(pc(cr_v,prev.get('cr')))))\n    mv=sorted([m for m in movers if m[1] is not None],key=lambda x:x[1],reverse=True)\n    if len(mv)>=2:\n        L.append('En iyi: '+' | '.join('%s %s'%(t,fp(c)) for t,c in mv[:3]))\n        L.append('En kotu: '+' | '.join('%s %s'%(t,fp(c)) for t,c in mv[-3:][::-1]))\n    bl=[]\n    if spx: bl.append('S&P500 '+fp(spx[1]))\n    if xu and fxc is not None: bl.append('BIST100($) '+fp(((1+xu[1]/100)/(1+fxc/100)-1)*100))\n    if gold: bl.append('Altin(ons) '+fp(gold[1]))\n    if bl: L.append('Benchmark: '+' | '.join(bl))\n    data=urllib.parse.urlencode({'chat_id':owner,'text':chr(10).join(L)}).encode()\n    try:\n        urllib.request.urlopen('https://api.telegram.org/bot'+TOK+'/sendMessage',data=data,timeout=30)\n        print('summary sent')\n    except Exception as ex:\n        print('summary fail',repr(ex)[:120])\nPYEOF"}, {"name": "Commit", "run": "git config user.name hist-bot\ngit config user.email actions@users.noreply.github.com\ngit add history.json\ngit diff --cached --quiet || git commit -m 'Daily snapshot'\ngit pull --rebase origin main || true\ngit push"}]}}}
