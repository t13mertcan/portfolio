{"name": "Daily portfolio snapshot", "on": {"schedule": [{"cron": "15 20 * * 1-5"}], "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"snap": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"name": "Snapshot", "run": "python3 - <<'PYEOF'\nimport json,urllib.request,datetime\nP=json.load(open('positions.json'))\nbist=[(x['tk'],x['qty']) for x in P['positions'] if x['cls']=='BIST']\nus=[(x['tk'],x['qty']) for x in P['positions'] if x['cls']=='ABD']\ncr=[('BINANCE:'+x['tk']+'USDT',x['qty']) for x in P['positions'] if x['cls']=='Kripto']\ndef scan(market,tickers):\n    if not tickers: return {}\n    body=json.dumps({'symbols':{'tickers':tickers,'query':{'types':[]}},'columns':['close']}).encode()\n    q=urllib.request.Request('https://scanner.tradingview.com/'+market+'/scan',data=body,headers={'User-Agent':'Mozilla/5.0','Content-Type':'application/json'})\n    j=json.load(urllib.request.urlopen(q,timeout=30))\n    return {r['s']:r['d'][0] for r in j.get('data',[])}\ntr=scan('turkey',['BIST:'+t for t,_ in bist])\nus_c=[p+t for t,_ in us for p in ('NASDAQ:','NYSE:','AMEX:')]\ngl=scan('global',us_c+[s for s,_ in cr]+['FX_IDC:USDTRY'])\nfx=gl['FX_IDC:USDTRY']\ntot=P['cash_usd']+P['cash_try']/fx\nmiss=[]\nfor t,q in bist:\n    p=tr.get('BIST:'+t)\n    if p is None: miss.append(t)\n    else: tot+=p*q/fx\nfor t,q in us:\n    p=None\n    for pre in ('NASDAQ:','NYSE:','AMEX:'):\n        p=gl.get(pre+t)\n        if p is not None: break\n    if p is None: miss.append(t)\n    else: tot+=p*q\nfor s,q in cr:\n    p=gl.get(s)\n    if p is None: miss.append(s)\n    else: tot+=p*q\nassert not miss, miss\nd=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d')\ntry: H=json.load(open('history.json'))\nexcept Exception: H={'points':[]}\npts=[x for x in H.get('points',[]) if x['d']!=d]\npts.append({'d':d,'v':round(tot,2)})\npts.sort(key=lambda x:x['d'])\njson.dump({'points':pts},open('history.json','w'))\nprint(d,round(tot,2),'fx',fx)\nPYEOF"}, {"name": "Commit", "run": "git config user.name hist-bot\ngit config user.email actions@users.noreply.github.com\ngit add history.json\ngit diff --cached --quiet || git commit -m 'Daily snapshot'\ngit push"}]}}}
